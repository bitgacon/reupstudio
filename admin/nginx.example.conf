# Merge into an existing HTTPS Nginx configuration; replace the domain/certificate paths.
# This file does NOT deploy TLS or expose the local Python process automatically.
limit_req_zone $binary_remote_addr zone=reup_license:10m rate=5r/m;
server {
    listen 443 ssl;
    server_name license.example.com;
    ssl_certificate /etc/letsencrypt/live/license.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/license.example.com/privkey.pem;
    client_max_body_size 4k;
    location = /v1/activate {
        limit_req zone=reup_license burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18880;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        # Access logs may record path/status but must never log request body/key.
    }
    location / { return 404; }
    location = /v1/refresh {
        limit_req zone=reup_license burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18880;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
    }
}
